name: Bytea ZIP data reading test

on:
  workflow_dispatch:
  pull_request:  
  push:
    branches:
      - master
      - main
jobs:
  detect-pgversion:
    runs-on: ubuntu-latest
    outputs:
      pgversion: ${{ steps.detect-pgversion.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
      
      - name: detect-pgversion
        id: detect-pgversion
        run: |
          targets=`bash GitHubActions/detect_targets.sh`
          echo "targets=$targets" >> $GITHUB_OUTPUT

  test:
    needs: detect-pgversion
    env:
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
    strategy:
      fail-fast: false
      matrix:
        pg: ${{ fromJSON(needs.detect-pgversion.outputs.pgversion) }}
        
    name: Test on PostgreSQL ${{ matrix.pg }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: tar
        run: tar zcvf bytea_unzip.tar.gz ./*

      - name: set_proxy
        run: bash GitHubActions/env.sh

      - name: install locales
        run: bash GitHubActions/install_locales.sh

      - name: build PostgreSQL ${{ matrix.pg }}
        run: bash GitHubActions/build_postgres.sh ${{ matrix.pg }} --with-libxml

      - name: install libzip
        run: bash GitHubActions/install_lib.sh

      - name: build bytea_unzip
        run: |
          bash GitHubActions/build_bytea_unzip.sh ${{ matrix.pg }}

      - name: execute bytea_unzip test
        run: bash GitHubActions/execute_test.sh ${{ matrix.pg }}

      - name: download output files (regression.diffs)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.pg }}-${{ matrix.config }}-test-results
          path: |
            workdir/postgresql-${{ matrix.pg }}/contrib/bytea_unzip/regression.diffs
            workdir/postgresql-${{ matrix.pg }}/contrib/bytea_unzip/regression.out
            workdir/postgresql-${{ matrix.pg }}/contrib/bytea_unzip/results
          retention-days: 5
